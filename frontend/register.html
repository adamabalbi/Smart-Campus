<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Campus — Inscription étudiant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body class="auth-page">
  <div class="auth-box" style="max-width:520px">
    <div class="auth-logo">Smart Campus</div>
    <div class="auth-sub">Formulaire d'inscription étudiant</div>

    <!-- Formulaire -->
    <form id="registerForm">
      <h2>Créer un compte</h2>
      <div id="registerAlert" class="alert alert-error hidden"></div>

      <div class="form-grid" style="grid-template-columns:1fr 1fr">
        <div class="field">
          <label>Nom <span style="color:var(--danger)">*</span></label>
          <input type="text" id="rNom" required>
        </div>
        <div class="field">
          <label>Prénom <span style="color:var(--danger)">*</span></label>
          <input type="text" id="rPrenom" required>
        </div>
      </div>

      <div class="field">
        <label>Email <span style="color:var(--danger)">*</span></label>
        <input type="email" id="rEmail" required placeholder="votre@email.com">
      </div>

      <div class="field">
        <label>Téléphone</label>
        <input type="text" id="rTelephone" placeholder="+221 77 000 00 00">
      </div>

      <div class="form-grid" style="grid-template-columns:1fr 1fr">
        <div class="field">
          <label>Filière <span style="color:var(--danger)">*</span></label>
          <input type="text" id="rFiliere" required placeholder="ex: Informatique">
        </div>
        <div class="field">
          <label>Niveau <span style="color:var(--danger)">*</span></label>
          <input type="text" id="rNiveau" required placeholder="ex: L1, M2">
        </div>
      </div>

      <div class="field">
        <label>Département</label>
        <input type="text" id="rDepartement" placeholder="ex: Sciences et Technologies">
      </div>

      <div class="cf-turnstile" data-sitekey="0x4AAAAAADkHhX0n8-SmuPok" data-theme="light" style="margin-bottom:0.9rem"></div>
      <button type="submit" class="btn-full" id="registerBtn">Soumettre la demande</button>

      <p style="text-align:center;margin-top:1rem;font-size:13px;color:var(--muted)">
        Déjà inscrit ? <a href="index.html" style="color:var(--primary)">Se connecter</a>
      </p>
    </form>

    <!-- Succès -->
    <div id="successView" class="hidden" style="text-align:center;padding:1rem 0">
      <div style="font-size:2.5rem;margin-bottom:1rem"><i class="fa-solid fa-envelope"></i></div>
      <h2 style="margin-bottom:.5rem">Demande envoyée !</h2>
      <p style="color:var(--muted);font-size:13px;margin-bottom:1.5rem">
        Un email de confirmation a été envoyé à <strong id="confirmedEmail"></strong>.
        Cliquez sur le lien dans l'email pour valider votre adresse,
        puis votre dossier sera examiné par l'administration.
      </p>
      <a href="index.html" class="btn-primary btn" style="display:inline-block">
        Retour à la connexion
      </a>
    </div>
  </div>
  <script src="config.js"></script>
<script src="register.js"></script>
</body>
</html>
