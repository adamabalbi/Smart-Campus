<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Campus — Connexion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <div class="auth-box">
    <div class="auth-logo">Smart Campus</div>
    <div class="auth-sub">Plateforme de gestion universitaire</div>

    <!-- Étape 1 : Login -->
    <form id="loginForm">
      <h2>Connexion</h2>
      <div id="loginAlert" class="alert alert-error hidden"></div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="admin@campus.edu" required autofocus>
      </div>
      <div class="field">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-full" id="loginBtn">Se connecter</button>
      <p style="text-align:center;margin-top:1rem;font-size:13px;color:var(--muted)">
        Étudiant ? <a href="register.html" style="color:var(--primary)">Créer un compte</a>
      </p>
    </form>

    <!-- Étape 2 : OTP -->
    <form id="otpForm" class="hidden">
      <h2>Vérification OTP</h2>
      <div id="otpAlert" class="alert alert-error hidden"></div>
      <p id="otpHint" style="font-size:13px;color:var(--muted);margin-bottom:1rem;"></p>
      <div class="field">
        <label for="otpCode">Code OTP (6 chiffres)</label>
        <input type="text" id="otpCode" maxlength="6" placeholder="123456" required inputmode="numeric">
      </div>
      <div style="display:flex;gap:0.5rem;">
        <button type="button" class="btn-ghost" id="backBtn" style="flex:1">Retour</button>
        <button type="submit" id="otpBtn" style="flex:2">Vérifier</button>
      </div>
    </form>
  </div>
  <script src="config.js"></script>
<script src="auth.js"></script>
</body>
</html>
